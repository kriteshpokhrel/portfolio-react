<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fast code is the visible tip; slow engineering is the mass beneath">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="berg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173a55"/>
      <stop offset="100%" stop-color="#0c2334"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#eaf6fb"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="62%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="bergClip">
      <path d="M556 300 L708 300 L748 352 L822 428 L836 506 L784 588 L690 644 L582 648 L484 588 L448 494 L470 398 L520 344 Z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" fill="url(#vig)"/>

  <!-- soft glow behind the tip -->
  <circle cx="652" cy="270" r="90" fill="#22d3ee" opacity="0.20" filter="url(#soft)"/>
  <!-- submerged glow -->
  <ellipse cx="642" cy="500" rx="230" ry="180" fill="#1f5273" opacity="0.14" filter="url(#soft)"/>

  <!-- BELOW WATER mass -->
  <path d="M556 300 L708 300 L748 352 L822 428 L836 506 L784 588 L690 644 L582 648 L484 588 L448 494 L470 398 L520 344 Z"
        fill="url(#berg)"/>
  <!-- inner strata / hidden layers -->
  <g clip-path="url(#bergClip)" stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="3">
    <line x1="440" y1="360" x2="850" y2="360"/>
    <line x1="440" y1="410" x2="850" y2="410"/>
    <line x1="440" y1="460" x2="850" y2="460"/>
    <line x1="440" y1="510" x2="850" y2="510"/>
    <line x1="440" y1="560" x2="850" y2="560"/>
    <line x1="440" y1="610" x2="850" y2="610"/>
  </g>
  <!-- rim light on the upper-left face -->
  <path d="M484 588 L448 494 L470 398 L520 344 L556 300"
        fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- ABOVE WATER tip -->
  <path d="M596 300 L616 246 L636 268 L658 206 L680 250 L700 272 L708 300 Z" fill="url(#tip)" filter="url(#glow)"/>
  <path d="M658 206 L680 250 L700 272 L708 300 L676 300 Z" fill="#38bdf8" opacity="0.4"/>

  <!-- waterline -->
  <line x1="120" y1="300" x2="1160" y2="300" stroke="url(#accent)" stroke-width="2.5" opacity="0.7" filter="url(#glow)"/>
  <!-- faint reflection of the tip -->
  <path d="M596 300 L616 336 L636 320 L658 356 L680 322 L700 330 L708 300 Z" fill="#7dd3fc" opacity="0.08"/>

  <!-- rising bubbles -->
  <g fill="#7dd3fc" opacity="0.5">
    <circle cx="612" cy="392" r="4"/><circle cx="694" cy="470" r="3"/>
    <circle cx="640" cy="540" r="5"/><circle cx="726" cy="360" r="3"/>
    <circle cx="566" cy="470" r="3"/>
  </g>

  <!-- labels -->
  <text x="742" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" letter-spacing="4" fill="#e5e7eb">FAST CODE</text>
  <line x1="726" y1="252" x2="710" y2="268" stroke="#e5e7eb" stroke-width="1.5" opacity="0.6"/>
  <text x="640" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" letter-spacing="5" fill="#dbeafe" text-anchor="middle" opacity="0.92">SLOW ENGINEERING</text>
  <text x="640" y="530" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2" fill="#93c5fd" text-anchor="middle" opacity="0.7">everything you still have to maintain</text>
</svg>
