<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AGENTS.md core routing to repository docs">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="62%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" fill="url(#vig)"/>
  <circle cx="640" cy="360" r="360" fill="url(#coreGlow)"/>

  <!-- tilted orbital rings -->
  <g transform="rotate(-18 640 360)">
    <ellipse cx="640" cy="360" rx="330" ry="150" fill="none" stroke="#22d3ee" stroke-opacity="0.13" stroke-width="2"/>
    <ellipse cx="640" cy="360" rx="250" ry="112" fill="none" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="2"/>
    <ellipse cx="640" cy="360" rx="165" ry="74"  fill="none" stroke="#3b82f6" stroke-opacity="0.09" stroke-width="2"/>
  </g>

  <!-- energy beams core -> nodes -->
  <g stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="640" y1="360" x2="640" y2="150" filter="url(#glow)"/>
    <line x1="640" y1="360" x2="858" y2="252"/>
    <line x1="640" y1="360" x2="858" y2="468" filter="url(#glow)"/>
    <line x1="640" y1="360" x2="640" y2="570"/>
    <line x1="640" y1="360" x2="422" y2="468"/>
    <line x1="640" y1="360" x2="422" y2="252"/>
  </g>

  <!-- traveling pulse dots -->
  <g fill="#a5f3fc">
    <circle cx="640" cy="256" r="5" filter="url(#glow)"/>
    <circle cx="770" cy="424" r="5" filter="url(#glow)"/>
    <circle cx="509" cy="414" r="4"/>
  </g>

  <!-- floating particles (bleed into banner sides) -->
  <g fill="#22d3ee" opacity="0.7">
    <circle cx="180" cy="210" r="3"/><circle cx="1120" cy="250" r="3"/>
    <circle cx="150" cy="470" r="2.5"/><circle cx="1140" cy="520" r="3"/>
    <circle cx="250" cy="600" r="2.5"/><circle cx="1050" cy="150" r="2.5"/>
  </g>
  <g fill="#64748b" opacity="0.6">
    <circle cx="120" cy="360" r="2.5"/><circle cx="1160" cy="380" r="2.5"/>
    <circle cx="300" cy="120" r="2"/><circle cx="1000" cy="620" r="2"/>
  </g>

  <!-- outer module nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#d4eefb" text-anchor="middle">
    <g><rect x="562" y="122" width="156" height="52" rx="12" fill="#0d1b2a" stroke="url(#accent)" stroke-width="2"/><text x="640" y="155">architecture</text></g>
    <g><rect x="782" y="226" width="150" height="52" rx="12" fill="#0d1b2a" stroke="url(#accent)" stroke-width="2"/><text x="857" y="259">standards</text></g>
    <g><rect x="782" y="442" width="150" height="52" rx="12" fill="#0d1b2a" stroke="url(#accent)" stroke-width="2"/><text x="857" y="475">examples</text></g>
    <g><rect x="562" y="544" width="156" height="52" rx="12" fill="#0d1b2a" stroke="url(#accent)" stroke-width="2"/><text x="640" y="577">templates</text></g>
    <g><rect x="347" y="442" width="150" height="52" rx="12" fill="#0d1b2a" stroke="url(#accent)" stroke-width="2"/><text x="422" y="475">guides</text></g>
    <g><rect x="347" y="226" width="150" height="52" rx="12" fill="#0d1b2a" stroke="url(#accent)" stroke-width="2"/><text x="422" y="259">adr</text></g>
  </g>

  <!-- core: soft halo, ring, node -->
  <rect x="512" y="313" width="256" height="94" rx="20" fill="#22d3ee" opacity="0.30" filter="url(#softGlow)"/>
  <rect x="500" y="303" width="280" height="114" rx="24" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="524" y="325" width="232" height="70" rx="16" fill="url(#core)" filter="url(#glow)"/>
  <text x="640" y="371" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="31" font-weight="700" fill="#062536" text-anchor="middle">AGENTS.md</text>

  <!-- caption -->
  <text x="640" y="682" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" letter-spacing="5" fill="#7dd3fc" text-anchor="middle" opacity="0.85">ONE ENTRY POINT · EVERY ROUTE</text>
</svg>
