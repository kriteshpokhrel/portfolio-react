<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SDLC time allocation: traditional vs AI-augmented">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173a55"/>
      <stop offset="100%" stop-color="#0c2334"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" fill="url(#vig)"/>

  <!-- title -->
  <text x="300" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#3b82f6">SDLC TIME ALLOCATION</text>

  <!-- TRADITIONAL -->
  <text x="300" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="3" fill="#71717a">TRADITIONAL SDLC</text>
  <text x="300" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#a1a1aa">Most of the time is spent writing code.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">
    <g><rect x="300" y="260" width="75"  height="80"  rx="12" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/><text x="337" y="362" fill="#a1a1aa">Reqs</text></g>
    <g><rect x="387" y="260" width="75"  height="80"  rx="12" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/><text x="424" y="362" fill="#a1a1aa">Design</text></g>
    <g><rect x="474" y="165" width="215" height="175" rx="16" fill="url(#accentFill)" stroke="url(#accent)" stroke-width="3"/><text x="581" y="362" font-weight="600" fill="#e5e7eb">Coding</text></g>
    <g><rect x="701" y="245" width="95"  height="95"  rx="12" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/><text x="748" y="362" fill="#a1a1aa">Testing</text></g>
    <g><rect x="808" y="245" width="95"  height="95"  rx="12" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/><text x="855" y="362" fill="#a1a1aa">Validation</text></g>
    <g><rect x="915" y="272" width="65"  height="68"  rx="12" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/><text x="947" y="362" fill="#a1a1aa">Deploy</text></g>
  </g>

  <line x1="300" y1="398" x2="980" y2="398" stroke="#27272a" stroke-width="2"/>

  <!-- AI-AUGMENTED -->
  <text x="300" y="440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" letter-spacing="3" fill="#71717a">AI-AUGMENTED SDLC</text>
  <text x="300" y="466" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#a1a1aa">Focus shifts to problem framing and validation.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">
    <g><rect x="300" y="480" width="205" height="160" rx="16" fill="url(#accentFill)" stroke="url(#accent)" stroke-width="3"/><text x="402" y="682" font-weight="600" fill="#e5e7eb">Problem framing</text></g>

    <g>
      <rect x="528" y="500" width="130" height="140" rx="14" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/>
      <rect x="546" y="530" width="94" height="13" rx="6" fill="#3b82f6" opacity="0.85"/>
      <rect x="546" y="558" width="94" height="13" rx="6" fill="#2f6fd0" opacity="0.7"/>
      <rect x="546" y="586" width="94" height="13" rx="6" fill="#3b82f6" opacity="0.85"/>
      <rect x="541" y="482" width="104" height="30" rx="15" fill="#1d4ed8"/>
      <text x="593" y="502" font-size="13" font-weight="700" letter-spacing="1" fill="#e5e7eb">IN PARALLEL</text>
      <text x="593" y="678" font-size="13" fill="#a1a1aa">Design · Coding ·</text>
      <text x="593" y="694" font-size="13" fill="#a1a1aa">Testing</text>
    </g>

    <g><rect x="681" y="480" width="205" height="160" rx="16" fill="url(#accentFill)" stroke="url(#accent)" stroke-width="3"/><text x="783" y="682" font-weight="600" fill="#e5e7eb">Validation</text></g>
    <g><rect x="909" y="572" width="70"  height="68"  rx="12" fill="#16171b" stroke="#3a3a3f" stroke-width="2"/><text x="944" y="682" fill="#a1a1aa">Deploy</text></g>
  </g>
</svg>
