<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/developer-icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Portfolio and blog of Kritesh Pokhrel, a full-stack software engineer. Home of the writing series 'AI, As I See It'."
    />
    <meta name="author" content="Kritesh Pokhrel" />
    <link rel="canonical" href="https://kriteshp.com.np/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kritesh Pokhrel" />
    <meta property="og:title" content="Kritesh Pokhrel — Full-Stack Developer & Writer" />
    <meta
      property="og:description"
      content="Portfolio and blog of Kritesh Pokhrel, a full-stack software engineer. Home of the writing series 'AI, As I See It'."
    />
    <meta property="og:url" content="https://kriteshp.com.np/" />
    <meta property="og:image" content="https://kriteshp.com.np/kritesh.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kritesh Pokhrel — Full-Stack Developer & Writer" />
    <meta
      name="twitter:description"
      content="Portfolio and blog of Kritesh Pokhrel, a full-stack software engineer."
    />
    <meta name="twitter:image" content="https://kriteshp.com.np/kritesh.jpg" />

    <title>Kritesh Pokhrel — Full-Stack Developer & Writer</title>
  </head>
  <body>
    <form name="guestbook-entry" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="guestbook-entry" />
      <input name="name" />
      <textarea name="message"></textarea>
      <textarea name="drawing"></textarea>
      <input name="visitorId" />
      <input name="website" />
    </form>
    <form name="guestbook-report" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="guestbook-report" />
      <input name="entryId" />
      <input name="reason" />
      <textarea name="details"></textarea>
      <input name="visitorId" />
      <input name="website" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
